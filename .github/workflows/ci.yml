name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./ci.db
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-bytes
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-bytes
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Unit tests and production build
        run: |
          npm test --prefix server
          npm run build --prefix client

      - name: Dependency audit
        run: |
          npm audit --prefix server --audit-level=high
          npm audit --prefix client --audit-level=high

      - name: Prepare integration database
        run: |
          npm run prisma:deploy --prefix server
          npm run seed --prefix server

      - name: API and realtime integration tests
        run: |
          cd server
          node src/index.js >../server-ci.log 2>&1 &
          server_pid=$!
          cd ..
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sed -n '1,240p' server-ci.log
              exit 1
            fi
            sleep 1
          done
          npm run test:api --prefix client
          npm run test:security --prefix client
          npm run test:e2e --prefix client
